name: Yayinla (onayli)

# Uretim kosusunun paketini inceledikten sonra ELLE calistirilir. Kalite kontrolunden gecmemis
# veya daha once yuklenmis paket yuklenmez (yayinla.py).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Uretim kosusunun run_id'si (Actions > Shorts Otomasyon > kosu adresindeki sayi)"
        required: true
        type: string
      gizlilik:
        description: "YouTube gizlilik"
        type: choice
        default: "public"
        options: [public, unlisted, private]
      deneme:
        description: "1 = yuklemeden sadece kontrol et"
        type: string
        default: "0"

concurrency:
  group: shorts-uretim
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Paketi indir
        uses: actions/download-artifact@v4
        with:
          name: yayin-paketi
          path: cikti/paket
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Gizli dosyalari olustur
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: Yayinla
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.deneme }}" = "1" ]; then
            python yayinla.py --paket cikti/paket --gizlilik "${{ inputs.gizlilik }}" --deneme
          else
            python yayinla.py --paket cikti/paket --gizlilik "${{ inputs.gizlilik }}"
          fi
      - name: Kaydi repoya yaz
        if: success() && inputs.deneme != '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add veri/videolar.json gecmis.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "yayin kaydi: ${{ inputs.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
