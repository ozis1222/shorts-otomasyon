name: Testler

on:
  push:
    paths: ["**.py", "tests/**", ".github/workflows/testler.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Testler Kokoro'yu sahte modelle dener: agir torch/kokoro kurulmaz
      - run: grep -vE '^(kokoro)$' requirements.txt > req-test.txt && pip install -r req-test.txt pytest
      - run: python -m pytest -q tests
