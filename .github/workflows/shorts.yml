name: Shorts Otomasyon (uret + kalite kontrol)

# URETIM ve YAYIN AYRIDIR. Bu is videoyu uretir, kalite/uygunluk kontrolunden gecirir ve
# "yayin-paketi" artifact'i olarak saklar. VARSAYILAN OLARAK HICBIR SEY YAYINLAMAZ.
# Onaylamak icin: Actions > "Yayinla (onayli)" > Run workflow > bu kosunun run_id'si.
on:
  # Haftada 5 Shorts (Pzt-Cum) 15:17 UTC = 18:17 Turkiye = 11:17 ABD Dogu.
  schedule:
    - cron: "17 15 * * 1-5"
  workflow_dispatch:   # elle (veya cron-job.org ile) ek video icin
    inputs:
      privacy:
        description: "YouTube gizlilik"
        type: choice
        default: "private"
        options: [public, unlisted, private]
      upload:
        description: "Onaysiz DOGRUDAN yukle? 0=hayir (onerilen: paket uret, sonra Yayinla ile onayla), 1=evet"
        type: string
        default: "0"
      gorsel_stil:
        description: "Gorsel stil: B (varsayilan, sinematik), A (iyilestirilmis cizgi), AB (deney: gune gore donusumlu)"
        type: string
        default: ""
      motor:
        description: "Render motoru: remotion = animasyon, moviepy = eski stok klip"
        type: choice
        default: "remotion"
        options: [remotion, moviepy]

# Ayni anda iki kosu calisirsa hafiza dosyalari (gecmis.json) catisir -> sirayla calissin
concurrency:
  group: shorts-uretim
  cancel-in-progress: false

jobs:
  uret-ve-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # yuksek kalite kodlama + AI gorseller icin genis pay
    permissions:
      contents: write
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Derinlik modeli onbellegi (2.5D paralaks, ~99 MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/unsadark
          key: derinlik-depth-anything-v2-small-v1

      - name: Node kur (Remotion animasyon motoru)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Remotion bagimliliklari + headless Chrome
        working-directory: remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Gizli dosyalari olustur
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Video uret ve YouTube'a yukle
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          # Ucretsiz hikaye gorselleri (Cloudflare Workers AI / FLUX)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          # Girdisiz tetikleme (zamanlayici / cron-job.org) -> SADECE URET, yayinlama (onay bekler)
          PRIVACY:            ${{ inputs.privacy || 'private' }}
          # Dis tetikleyici (cron-job.org vb.) upload=1 gonderse bile yukleme YAPILMAZ; dogrudan yukleme
          # yalnizca repo degiskeni OTOMATIK_YAYIN=1 iken acilir (kullanici onayiyla). Normal yol: yayinla.yml
          UPLOAD_TO_YOUTUBE:  ${{ vars.OTOMATIK_YAYIN == '1' && inputs.upload || '0' }}
          RENDER_MOTORU:      ${{ inputs.motor || 'remotion' }}
          GORSEL_STIL:        ${{ inputs.gorsel_stil || vars.GORSEL_STIL || 'B' }}
          # Loglar canli aksin: is zaman asimina ugrarsa nerede takildigi gorunsun
          PYTHONUNBUFFERED:   "1"
        run: python shorts_otomasyon.py

      - name: Hafizayi repoya kaydet (konu gecmisi + performans + gorsel)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Sadece VAR OLAN dosyalari ekle (toplu 'git add' eksik dosyada tumden basarisiz olur)
          for f in gecmis.json performans.json viral_ornekler.json kullanilan_gorseller.txt veri/videolar.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "hafizada degisiklik yok"
            exit 0
          fi

          git commit -m "hafiza guncellendi: konu gecmisi + performans [skip ci]"

          # Baska bir kosu araya girdiyse cakismadan birlestir, 3 kez dene
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "hafiza kaydedildi"
              exit 0
            fi
            echo "push denemesi $i basarisiz, tekrar deneniyor..."
            sleep 5
          done
          echo "hafiza push edilemedi (bir sonraki kosuda tekrar denenecek)"

      - name: Yayin paketini sakla (onay icin; video + thumbnail + meta.json + kalite raporu)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yayin-paketi
          path: cikti/paket/
          retention-days: 14
          if-no-files-found: ignore
