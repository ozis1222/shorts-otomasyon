name: Shorts Otomasyon

on:
  workflow_dispatch:   # Sadece cron-job.org tetikler

jobs:
  uret-ve-yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Kodu indir
        uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ffmpeg ve font kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt
      - name: Gizli dosyalari olustur
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: Video uret ve YouTube'a yukle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python shorts_otomasyon.py
      - name: Kullanilan gorsel hafizasini repoya kaydet
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add kullanilan_gorseller.txt
          git commit -m "gorsel hafizasi guncellendi [skip ci]" || exit 0
          git push
